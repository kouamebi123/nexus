name: Assemble Nexus sources

on:
  push:
    branches:
      - main
      - restore-complete-sources-2
    paths:
      - '.nexus_parts/**'
      - '.github/workflows/assemble-nexus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore complete source files
        shell: bash
        run: |
          set -euo pipefail
          test -f .nexus_parts/backend_app.py.gz.b64
          test -f .nexus_parts/frontend_app.js.gz.b64
          base64 -d .nexus_parts/backend_app.py.gz.b64 | gzip -d > backend/app.py
          base64 -d .nexus_parts/frontend_app.js.gz.b64 | gzip -d > frontend/app.js
          python -m py_compile backend/app.py
          node --check frontend/app.js

      - name: Commit restored sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py frontend/app.js
          git rm -r .nexus_parts
          git commit -m "Restore complete Nexus application sources"
          git push origin HEAD:${GITHUB_REF_NAME}
