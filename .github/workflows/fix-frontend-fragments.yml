name: Fix Nexus frontend fragments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-frontend-fragments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported shorthand fragments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.js')
          s = p.read_text()
          if 'const Fragment = React.Fragment;' not in s:
              s = s.replace('  const html = htm.bind(React.createElement);', '  const html = htm.bind(React.createElement);\n  const Fragment = React.Fragment;')
          s = s.replace('<>', '<${Fragment}>').replace('</>', '</${Fragment}>')
          p.write_text(s)
          PY
          node --check frontend/app.js
          if grep -q '<>' frontend/app.js; then exit 1; fi
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js
          git rm .github/workflows/fix-frontend-fragments.yml
          git commit -m "Fix HTM React fragment rendering"
          git push origin HEAD:main
